services:
  sandbox-image:
    build:
      context: ./sandbox
    image: autoflow-sandbox:latest
    profiles: [tools]
    command: ["true"]

  autoflow:
    build: .
    ports:
      - "8765:8765"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUTOFLOW_RUNNER_TOKEN: ${AUTOFLOW_RUNNER_TOKEN:-}
      AUTOFLOW_ALLOWED_ROOTS: /workspace
      AUTOFLOW_DATABASE_PATH: /data/autoflow.db
      AUTOFLOW_SANDBOX_MODE: ${AUTOFLOW_SANDBOX_MODE:-docker}
      AUTOFLOW_SANDBOX_IMAGE: ${AUTOFLOW_SANDBOX_IMAGE:-autoflow-sandbox:latest}
    volumes:
      - ./data:/data
      - ./worktrees:/opt/autoflow/worktrees
      - ${AUTOFLOW_WORKSPACE:-..}:/workspace
