name: Runner Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build cryptography
      - run: python -m build --wheel
      - id: package
        run: echo "wheel=$(basename dist/*.whl)" >> "$GITHUB_OUTPUT"
      - name: Sign release manifest
        env:
          RUNNER_RELEASE_PRIVATE_KEY: ${{ secrets.RUNNER_RELEASE_PRIVATE_KEY }}
        run: |
          python scripts/build_release_manifest.py \
            --wheel "dist/${{ steps.package.outputs.wheel }}" \
            --version "${GITHUB_REF_NAME#v}" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.package.outputs.wheel }}" \
            --output runner-manifest.json
      - name: Publish signed Runner release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl runner-manifest.json --generate-notes
