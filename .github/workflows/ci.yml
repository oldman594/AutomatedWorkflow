name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autoflow_test
          POSTGRES_USER: autoflow_test
          POSTGRES_PASSWORD: autoflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoflow_test -d autoflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOFLOW_TEST_POSTGRES_URL: postgresql+psycopg://autoflow_test:autoflow_test_password@127.0.0.1:5432/autoflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: mypy app
      - run: node --check app/static/app.js
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - run: docker build -t autoflow-app:ci .
      - run: docker build -t autoflow-sandbox:ci sandbox/
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock autoflow-app:ci docker version

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Tauri Linux dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: npm ci
      - run: node --check ui/app.js
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
