[package]
name = "autoflow-desktop"
version = "1.1.0"
description = "AutoFlow desktop client and Local Runner host"
authors = ["AutoFlow"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "autoflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3", features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
